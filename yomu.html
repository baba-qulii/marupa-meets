  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: 'Zen Kaku Gothic New', 'Hiragino Kaku Gothic ProN', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; }

    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; padding: 20px 40px; display: flex; align-items: center; justify-content: space-between; background: rgba(26, 46, 29, 0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 0.5px solid rgba(168, 200, 170, 0.12); }

    .page-hero { background: var(--dark); padding: 120px 24px 72px; text-align: center; position: relative; overflow: hidden; }

    .articles-section { padding: 72px 24px 80px; max-width: 900px; margin: 0 auto; }

    .note-articles-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
    .note-card { display: flex; flex-direction: column; background: rgba(26,46,29,0.05); border: 0.5px solid rgba(26,46,29,0.14); border-radius: 12px; overflow: hidden; text-decoration: none; color: var(--text); transition: background 0.2s, transform 0.2s; }
    .note-card:hover { background: rgba(26,46,29,0.10); transform: translateY(-2px); }
    .note-card-img { width: 100%; aspect-ratio: 16/9; overflow: hidden; background: rgba(26,46,29,0.08); }
    .note-card-img img { width: 100%; height: 100%; object-fit: cover; }
    .note-card-body { padding: 18px 20px 22px; }
    .note-card-date { font-size: 10px; letter-spacing: 0.12em; color: var(--moss-light); font-family: sans-serif; margin-bottom: 8px; opacity: 0.8; }
    .note-card-title { font-size: 14px; line-height: 1.7; color: var(--text); }
    .note-articles-loading { text-align: center; padding: 60px 0; color: var(--text-sub); font-size: 13px; }
    .note-articles-fallback { text-align: center; padding: 40px 0; display: none; }
    .note-more-wrap { display: flex; justify-content: center; margin-top: 40px; }
    .note-more-btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border: 0.5px solid rgba(26,46,29,0.3); border-radius: 40px; font-size: 12px; letter-spacing: 0.12em; color: var(--text); text-decoration: none; font-family: sans-serif; transition: background 0.2s; }
    .note-more-btn:hover { background: rgba(26,46,29,0.08); }
    @media (max-width: 600px) { .note-articles-list { grid-template-columns: 1fr; } }

    .back-link-wrap { padding: 0 24px 80px; text-align: center; }
    .back-link { font-size: 11px; letter-spacing: 0.18em; color: var(--moss-light); text-decoration: none; font-family: sans-serif; display: inline-flex; align-items: center; gap: 6px; transition: color 0.2s; }
    .back-link:hover { color: var(--text); }

    .links-section { background: var(--dark); padding: 64px 24px; text-align: center; border-top: 0.5px solid rgba(255,255,255,0.12); }
    .links-label { font-size: 11px; letter-spacing: 0.2em; color: var(--moss-pale); text-transform: uppercase; margin-bottom: 32px; }
    .links-grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 600px; margin: 0 auto; }
    .link-card { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 24px 28px; background: rgba(255,255,255,0.05); border: 0.5px solid rgba(255,255,255,0.12); border-radius: 12px; text-decoration: none; color: #ffffff; transition: background 0.2s; min-width: 140px; }
    .link-card:hover { background: rgba(255,255,255,0.1); }
    @media (max-width: 600px) {
      .links-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 100%; }
      .link-card { min-width: 0; padding: 16px 8px; }
    }
    .link-icon { color: var(--moss-pale); }
    .link-name { font-size: 13px; letter-spacing: 0.1em; }
    .link-url { font-size: 11px; color: rgba(168,200,170,0.5); letter-spacing: 0.05em; font-family: sans-serif; }
    footer { background: var(--dark); padding: 48px 40px; text-align: center; border-top: 0.5px solid rgba(168, 200, 170, 0.1); }
    .footer-logo { font-size: 12px; letter-spacing: 0.28em; color: rgba(168, 200, 170, 0.28); margin-bottom: 10px; }
    .footer-copy { font-size: 10px; letter-spacing: 0.1em; color: rgba(168, 200, 170, 0.15); font-family: sans-serif; }

    @media (max-width: 600px) { .site-header { padding: 16px 20px; } }

    .falling-leaf { position: fixed; top: -80px; pointer-events: none; z-index: 0; }
    @keyframes leaf-fall {
      0%   { transform: translateY(0) translateX(0) rotate(var(--r0)); opacity: 0; }
      5%   { opacity: var(--op); }
      40%  { transform: translateY(40vh) translateX(var(--sx)) rotate(calc(var(--r0) + 80deg)); }
      70%  { transform: translateY(75vh) translateX(calc(var(--sx) * -0.4)) rotate(calc(var(--r0) + 160deg)); }
      95%  { opacity: var(--op); }
      100% { transform: translateY(110vh) translateX(calc(var(--sx) * 0.6)) rotate(calc(var(--r0) + 260deg)); opacity: 0; }
    }
  </style>
</head>

  <script>
    var LEAF_SVGS = [
      '<svg viewBox="0 0 44 64" fill="none"><path d="M22 58 C22 58 4 44 3 28 C2 12 12 2 22 2 C32 2 42 12 41 28 C40 44 22 58 22 58Z" fill="currentColor"/><line x1="22" y1="56" x2="22" y2="4" stroke="white" stroke-width="0.7" opacity="0.25"/></svg>',
      '<svg viewBox="0 0 28 72" fill="none"><path d="M14 66 C14 66 2 50 2 32 C2 14 8 2 14 2 C20 2 26 14 26 32 C26 50 14 66 14 66Z" fill="currentColor"/><line x1="14" y1="64" x2="14" y2="4" stroke="white" stroke-width="0.6" opacity="0.25"/></svg>',
      '<svg viewBox="0 0 48 60" fill="none"><path d="M24 54 C24 54 2 42 2 24 C2 8 12 2 24 4 C36 2 46 8 46 24 C46 42 24 54 24 54Z" fill="currentColor"/><line x1="24" y1="52" x2="24" y2="6" stroke="white" stroke-width="0.7" opacity="0.25"/></svg>'
    ];
    var LEAF_COLORS = ['#a8c8aa', '#7aaa7e', '#b8d4ba', '#8ab88e', '#c8deca'];
    function spawnLeaf() {
      var el = document.createElement('div'); el.className = 'falling-leaf';
      var size = Math.random() * 22 + 12, x = Math.random() * 110 - 5, dur = Math.random() * 12 + 16;
      var delay = Math.random() * -dur, sway = Math.random() * 140 - 70, rot0 = Math.random() * 360;
      var opacity = Math.random() * 0.10 + 0.06, color = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
      el.style.cssText = 'left:' + x + 'vw;width:' + size + 'px;height:' + (size*1.5) + 'px;color:' + color + ';--r0:' + rot0 + 'deg;--sx:' + sway + 'px;--op:' + opacity + ';animation:leaf-fall ' + dur + 's linear ' + delay + 's infinite;';
      el.innerHTML = LEAF_SVGS[Math.floor(Math.random() * LEAF_SVGS.length)];
      document.body.appendChild(el);
    }
    for (var i = 0; i < 6; i++) spawnLeaf();

    (function() {
      var STATIC_ARTICLES = [
        { title: '絵本と朗読で楽しむ、SATO COMPANYの挑戦ストーリー', date: '2025.07.21', link: 'https://note.com/sato_company/n/nc9d78ed82980', thumb: 'https://assets.st-note.com/production/uploads/images/202382963/rectangle_large_type_2_89cebe193eb5c53eeb03ceb3bf2d00b2.jpeg?width=800' },
        { title: '読むラジオなるものを作ってみた in JAPAN SHOP2025', date: '2025.04.03', link: 'https://note.com/sato_company/n/n7b98d5d631b0', thumb: 'https://assets.st-note.com/production/uploads/images/181805756/rectangle_large_type_2_d90797fac45ddcbb71245f0efd37726f.jpeg?width=800' },
        { title: 'ベテラン事務職員を深ぼってみた！｜社員インタビュー', date: '2025.01.14', link: 'https://note.com/sato_company/n/nc18a1b843f59', thumb: 'https://assets.st-note.com/production/uploads/images/166111203/rectangle_large_type_2_243dbd1b84dd5d451f3ee7fa3284b181.png?width=800' },
        { title: '新入社員を深ぼってみた！｜社員インタビュー', date: '2024.10.30', link: 'https://note.com/sato_company/n/n65e07faee0a8', thumb: 'https://assets.st-note.com/production/uploads/images/170046861/rectangle_large_type_2_c0d153aa199ef147876f44bb456ae6db.png?width=800' },
        { title: '工場長を深ぼってみた！｜社員インタビュー', date: '2024.10.01', link: 'https://note.com/sato_company/n/n811e66c2e516', thumb: 'https://assets.st-note.com/production/uploads/images/153252480/rectangle_large_type_2_069b73b55bc412e9f07a003464e9cb44.png?width=800' },
        { title: 'noteはじめました！【自己紹介】', date: '2024.09.25', link: 'https://note.com/sato_company/n/n4b06488feeca', thumb: 'https://assets.st-note.com/production/uploads/images/138441791/rectangle_large_type_2_2c85ca96db980c758c0fb08e0e2e6b84.jpeg?width=800' }
      ];

      function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
      function fmtDate(str) { var d = new Date(str); return d.getFullYear() + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + String(d.getDate()).padStart(2,'0'); }

      function makeCard(title, date, link, thumb) {
        var a = document.createElement('a');
        a.href = link; a.target = '_blank'; a.className = 'note-card reveal';
        a.innerHTML = '<div class="note-card-img">' + (thumb ? '<img src="' + escHtml(thumb) + '" alt="" loading="lazy">' : '') + '</div>' +
          '<div class="note-card-body"><p class="note-card-title">' + escHtml(title) + '</p></div>';
        return a;
      }

      var list = document.getElementById('noteArticlesList');
      document.getElementById('noteLoading').remove();
      STATIC_ARTICLES.forEach(function(a) { list.appendChild(makeCard(a.title, a.date, a.link, a.thumb)); });

      // Try to refresh from RSS in the background
      var RSS_URL = 'https://note.com/sato_company/rss';
      var PROXY = 'https://api.allorigins.win/get?url=' + encodeURIComponent(RSS_URL);
      var ctrl = new AbortController();
      setTimeout(function(){ ctrl.abort(); }, 6000);
      fetch(PROXY, { signal: ctrl.signal })
        .then(function(r){ return r.json(); })
        .then(function(data) {
          var xml = new DOMParser().parseFromString(data.contents, 'text/xml');
          var items = xml.querySelectorAll('item');
          if (!items.length) return;
          list.innerHTML = '';
          items.forEach(function(item) {
            var title = item.getElementsByTagName('title')[0].textContent;
            var link = item.getElementsByTagName('link')[0].textContent.trim();
            var thumb = item.getElementsByTagNameNS('http://search.yahoo.com/mrss/', 'thumbnail')[0];
            list.appendChild(makeCard(title, '', link, thumb ? thumb.getAttribute('url') : null));
          });
        })
        .catch(function(){});
    })();
  </script>
